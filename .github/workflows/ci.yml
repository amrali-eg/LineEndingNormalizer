name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # Some tests create real NTFS junctions (mklink /J) to verify reparse-point
    # handling, so this must run on a Windows runner rather than any available OS.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore sources\LineEndingNormalizer.slnx

      - name: Build
        run: dotnet build sources\LineEndingNormalizer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test sources\LineEndingNormalizer.slnx --configuration Release --no-build
