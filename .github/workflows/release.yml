name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      CODE_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT }}
      CODE_SIGNING_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          [xml]$project = Get-Content "LineEndingNormalizer.csproj"

          # Select the Version node explicitly. Member access across several
          # PropertyGroup elements returns an array, which would stringify into
          # a value that matches nothing and block the release for the wrong
          # reason.
          $versionNodes = $project.SelectNodes("/Project/PropertyGroup/Version")
          if ($versionNodes.Count -ne 1) {
            throw "Expected exactly one <Version> in the project file; found $($versionNodes.Count)."
          }
          $projectVersion = [string]$versionNodes[0].InnerText
          [xml]$manifest = Get-Content "app.manifest"
          $manifestVersion = [string]$manifest.assembly.assemblyIdentity.version

          if ($tagVersion -ne $projectVersion) {
            throw "Tag version '$tagVersion' does not match project version '$projectVersion'."
          }

          if ($manifestVersion -ne "$projectVersion.0") {
            throw "Manifest version '$manifestVersion' does not match '$projectVersion.0'."
          }

      - name: Build
        run: dotnet build LineEndingNormalizer.slnx --configuration Release

      - name: Test
        run: dotnet test LineEndingNormalizer.slnx --configuration Release --no-build

      - name: Publish framework-dependent single-file executable
        run: dotnet publish LineEndingNormalizer.csproj -p:PublishProfile=FolderProfile

      - name: Publish self-contained single-file executable
        run: dotnet publish LineEndingNormalizer.csproj -p:PublishProfile=SelfContainedRelease

      - name: Code-sign executables
        if: ${{ env.CODE_SIGNING_CERT != '' && env.CODE_SIGNING_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CODE_SIGNING_CERT))

          try {
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
              Where-Object { $_.FullName -like "*\x64\*" } |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $signtool) {
              throw "signtool.exe not found on this runner image."
            }

            & $signtool sign /f $certPath /p $env:CODE_SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              "bin\Release\net10.0\publish\win-x64\LineEndingNormalizer.exe" `
              "bin\Release\net10.0\publish\win-x64-selfcontained\LineEndingNormalizer.exe"

            if ($LASTEXITCODE -ne 0) {
              throw "signtool exited with code $LASTEXITCODE."
            }
          } finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Package
        shell: pwsh
        run: |
          # Tag is "vX.Y.Z"; artifact names use the bare version, matching the
          # project's <Version> convention (no "v" prefix).
          $version = "${{ github.ref_name }}" -replace '^v', ''

          Compress-Archive -Path "bin\Release\net10.0\publish\win-x64\*" -DestinationPath "LineEndingNormalizer-$version-framework-dependent.zip"
          Compress-Archive -Path "bin\Release\net10.0\publish\win-x64-selfcontained\*" -DestinationPath "LineEndingNormalizer-$version-win-x64-self-contained.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          LineEndingNormalizer-*-framework-dependent.zip
          LineEndingNormalizer-*-win-x64-self-contained.zip
          --title "${{ github.ref_name }}"
          --generate-notes
